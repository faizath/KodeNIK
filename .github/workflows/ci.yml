name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON syntax with jq
        run: jq empty KodeNIK.json

      - name: Run Python integrity test suite
        run: python3 -m unittest discover -s test -p "test_*.py"

      - name: Run Node.js native test suite
        run: node --test test/validate.test.mjs
